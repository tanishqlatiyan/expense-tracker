<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#172033;--muted:#718096;--line:#e6eaf2;--accent:#635bff;--accent2:#817cff;--green:#16a66a;--red:#e05252;--shadow:0 12px 35px #18204a10}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 80% -10%,#e8e6ff 0,transparent 30%),var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#101526,#171d32);color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh}.brand{font-weight:850;font-size:21px;margin:0 8px 35px}.brand span{color:#918cff}.nav{display:grid;gap:8px}.nav button{background:transparent;color:#b9c0d1;text-align:left;padding:12px 14px;border-radius:10px;transition:.2s}.nav button.active,.nav button:hover{background:#272f48;color:#fff;transform:translateX(2px)}.main{padding:32px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{margin:0;font-size:30px;letter-spacing:-.5px}.sub{color:var(--muted);font-size:14px;margin-top:5px}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:11px 16px;border-radius:10px;font-weight:750;box-shadow:0 8px 18px #635bff2e}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.card{padding:20px;transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:0 16px 35px #18204a16}.label{font-size:13px;color:var(--muted)}.value{font-size:26px;font-weight:850;margin-top:8px}.green{color:var(--green)}.red{color:var(--red)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.panel{padding:20px}.panel h2{font-size:17px;margin:0 0 18px}.bar{height:10px;background:#edf0f5;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.cat{margin:15px 0}.cathead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px}.table{margin-top:18px;overflow:auto}.toolbar{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}.toolbar input,.toolbar select,.form input,.form select{border:1px solid var(--line);padding:10px 12px;border-radius:9px;background:#fff;outline:none}.toolbar input{min-width:220px}.toolbar input:focus,.form input:focus,.form select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #635bff12}.tx{width:100%;border-collapse:collapse}.tx th,.tx td{padding:13px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.tx th{color:var(--muted);font-weight:650}.tx tr:hover td{background:#fafbff}.badge{padding:5px 8px;border-radius:99px;background:#f0f1ff;color:#5149d9;font-size:12px}.del{background:#fff1f1;color:var(--red);padding:6px 9px;border-radius:7px}.modal{position:fixed;inset:0;background:#10152680;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}.modal.show{display:flex}.dialog{background:#fff;border-radius:20px;padding:24px;width:min(480px,100%);box-shadow:0 25px 80px #0004}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:700}.form input,.form select{width:100%;margin-top:6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.secondary{background:#eef0f5;padding:10px 14px;border-radius:9px}.empty{text-align:center;color:var(--muted);padding:35px}.chart{height:190px;display:flex;align-items:end;gap:8px;padding-top:10px}.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}.col i{display:block;width:100%;max-width:32px;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:6px 6px 2px 2px;min-height:3px;transition:.25s}.col i:hover{filter:brightness(1.08);transform:scaleY(1.03)}.col small{font-size:10px;color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{grid-template-columns:repeat(4,1fr)}.nav button{font-size:12px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:550px){.main{padding:18px}.cards{grid-template-columns:1fr}.row{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}.nav{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">Spend<span>Wise</span></div><div class="nav"><button class="active">Dashboard</button><button onclick="document.getElementById('transactions').scrollIntoView({behavior:'smooth'})">Transactions</button><button onclick="openModal()">+ Add Expense</button><button onclick="clearAll()">Reset Data</button></div></aside><main class="main"><div class="top"><div><h1>Expense Tracker</h1><div class="sub" id="month"></div></div><button class="primary" onclick="openModal()">+ Add Expense</button></div><section class="cards"><div class="card"><div class="label">Total Income</div><div class="value green" id="income">₹0</div></div><div class="card"><div class="label">Total Expenses</div><div class="value red" id="expense">₹0</div></div><div class="card"><div class="label">Balance</div><div class="value" id="balance">₹0</div></div><div class="card"><div class="label">Transactions</div><div class="value" id="count">0</div></div></section><section class="grid"><div class="panel"><h2>Spending — Last 7 Days</h2><div class="chart" id="chart"></div></div><div class="panel"><h2>Spending by Category</h2><div id="categories"></div></div></section><section class="panel table" id="transactions"><h2>Recent Transactions</h2><div class="toolbar"><input id="search" placeholder="Search description..." oninput="render()"><select id="filter" onchange="render()"><option value="all">All categories</option></select><button class="secondary" onclick="addIncome()">+ Add Income</button></div><table class="tx"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Payment</th><th>Amount</th><th></th></tr></thead><tbody id="tbody"></tbody></table></section></main></div>
<div class="modal" id="modal"><div class="dialog"><h2>Add Transaction</h2><form class="form" onsubmit="save(event)"><div class="row"><label>Type<select id="type"><option value="expense">Expense</option><option value="income">Income</option></select></label><label>Amount (₹)<input id="amount" type="number" min="1" step="0.01" required></label></div><label>Description<input id="desc" required placeholder="e.g. Lunch, books, salary"></label><div class="row"><label>Category<select id="category"></select></label><label>Payment<select id="payment"><option>UPI</option><option>Cash</option><option>Card</option><option>Bank Transfer</option><option>Other</option></select></label></div><label>Date<input id="date" type="date" required></label><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary">Save Transaction</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://gtxkfhdcmbmcmpmmphef.supabase.co';
const SUPABASE_KEY='sb_publishable_mBObAOR7aIB9FsIKez1kYQ__TxW7Q2G';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const cats=['Food','Transport','Education','Rent/PG','Shopping','Entertainment','Bills','Health','Other'];let data=[];
const money=n=>'₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:2});
function authBox(){if(document.getElementById('authBox'))return;const x=document.createElement('div');x.id='authBox';x.style='position:fixed;inset:0;background:#101526d9;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20';x.innerHTML='<div style="background:#fff;border-radius:20px;padding:26px;width:min(420px,100%);box-shadow:0 25px 80px #0004"><h2 style="margin:0 0 6px">Welcome to SpendWise</h2><p style="color:#718096;font-size:14px">Sign in to sync your expenses across devices.</p><form id="authForm" style="display:grid;gap:12px"><input id="authEmail" type="email" required placeholder="Email" style="padding:11px;border:1px solid #e6eaf2;border-radius:9px"><input id="authPassword" type="password" minlength="6" required placeholder="Password" style="padding:11px;border:1px solid #e6eaf2;border-radius:9px"><div style="display:flex;gap:10px"><button class="primary" type="submit">Sign in</button><button class="secondary" type="button" id="signupBtn">Create account</button></div><small id="authMsg" style="color:#718096"></small></form></div>';document.body.appendChild(x);document.getElementById('authForm').onsubmit=e=>auth(false,e);document.getElementById('signupBtn').onclick=()=>auth(true)}
async function auth(signup,e){if(e)e.preventDefault();const email=authEmail.value.trim(),password=authPassword.value;authMsg.textContent='Please wait…';const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error){authMsg.textContent=r.error.message;return}if(signup&&!r.data.session){authMsg.textContent='Check your email to confirm your account, then sign in.';return}document.getElementById('authBox')?.remove();await load()}
async function init(){document.getElementById('month').textContent=new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'});category.innerHTML=cats.map(c=>`<option>${c}</option>`).join('');filter.innerHTML='<option value="all">All categories</option>'+cats.map(c=>`<option>${c}</option>`).join('');date.value=new Date().toISOString().slice(0,10);const {data:{session}}=await sb.auth.getSession();if(session)await load();else authBox()}
async function load(){const {data:rows,error}=await sb.from('transactions').select('*').order('transaction_date',{ascending:false}).order('created_at',{ascending:false});if(error){alert(error.message);return}data=(rows||[]).map(x=>({id:x.id,type:x.type,amount:Number(x.amount),desc:x.description,category:x.category,payment:x.payment_method,date:x.transaction_date}));render();const {data:{user}}=await sb.auth.getUser();if(user&&!document.getElementById('logoutBtn')){const b=document.createElement('button');b.id='logoutBtn';b.className='secondary';b.textContent='Sign out';b.onclick=()=>sb.auth.signOut().then(()=>location.reload());document.querySelector('.top').appendChild(b)}}
async function save(e){e.preventDefault();const {data:{user}}=await sb.auth.getUser();if(!user)return;const r=await sb.from('transactions').insert({user_id:user.id,type:type.value,amount:+amount.value,description:desc.value,category:category.value,payment_method:payment.value,transaction_date:date.value});if(r.error){alert(r.error.message);return}closeModal();e.target.reset();date.value=new Date().toISOString().slice(0,10);await load()}
function addIncome(){openModal();setTimeout(()=>type.value='income',0)}
async function del(id){if(!confirm('Delete this transaction?'))return;const r=await sb.from('transactions').delete().eq('id',id);if(r.error){alert(r.error.message);return}await load()}
async function clearAll(){if(confirm('Delete all your transactions?')){const {data:{user}}=await sb.auth.getUser();if(user){const r=await sb.from('transactions').delete().eq('user_id',user.id);if(r.error){alert(r.error.message);return}await load()}}}
function openModal(){modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}
function render(){let inc=data.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=data.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);income.textContent=money(inc);expense.textContent=money(exp);balance.textContent=money(inc-exp);count.textContent=data.length;let q=search.value.toLowerCase(),f=filter.value;let rows=data.filter(x=>(!q||x.desc.toLowerCase().includes(q))&&(f==='all'||x.category===f));tbody.innerHTML=rows.length?rows.map(x=>`<tr><td>${new Date(x.date+'T00:00:00').toLocaleDateString('en-IN')}</td><td>${esc(x.desc)}</td><td><span class="badge">${x.category}</span></td><td>${x.payment}</td><td class="${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'-'}${money(x.amount)}</td><td><button class="del" onclick="del('${x.id}')">Delete</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No transactions yet. Add your first expense above.</td></tr>';let by={};data.filter(x=>x.type==='expense').forEach(x=>by[x.category]=(by[x.category]||0)+x.amount);let total=Object.values(by).reduce((a,b)=>a+b,0);categories.innerHTML=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([c,v])=>`<div class="cat"><div class="cathead"><span>${c}</span><b>${money(v)}</b></div><div class="bar"><div class="fill" style="width:${total?v/total*100:0}%"></div></div></div>`).join('')||'<div class="empty">Your category breakdown will appear here.</div>';let now=new Date(),days=[];for(let i=6;i>=0;i--){let d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-i);let key=d.toISOString().slice(0,10),v=data.filter(x=>x.type==='expense'&&x.date===key).reduce((a,x)=>a+x.amount,0);days.push({d,v})}let max=Math.max(1,...days.map(x=>x.v));chart.innerHTML=days.map(x=>`<div class="col"><i style="height:${x.v/max*145}px" title="${money(x.v)}"></i><small>${x.d.toLocaleDateString('en-IN',{weekday:'short'})}</small></div>`).join('')}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
init();
</script></body></html>
